server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ------------------------------------------------------------------
  # Collect all Docker container stdout/stderr logs via the host's
  # /var/lib/docker/containers directory.
  # ------------------------------------------------------------------
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse Docker JSON wrapper
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs

      # Promote the inner `log` field as the actual log line
      - output:
          source: log

      # Try to parse the log line as JSON (FastAPI emits structured JSON logs)
      - json:
          expressions:
            level: levelname
            logger: name
            request_id: request_id
            user_id: user_id
            http_method: http_method
            http_path: http_path
            http_status: http_status
            message: message

      # Add parsed fields as labels so they are searchable in Grafana/Loki
      - labels:
          stream:
          level:
          logger:
          http_method:
          http_status:

      # Use Docker container metadata as labels (requires Docker socket)
      - docker: {}

      # Timestamp from the Docker wrapper
      - timestamp:
          source: time
          format: RFC3339Nano
