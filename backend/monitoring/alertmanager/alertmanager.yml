global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - matchers:
        - severity = "critical"
      receiver: "critical"
      continue: false

receivers:
  - name: "default"
    # Webhook placeholder — replace with a real Telegram/Slack/email receiver in prod.
    # webhook_configs:
    #   - url: "http://your-alerting-webhook/alert"

  - name: "critical"
    # Uncomment and fill in when deploying:
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL}"
    #     channel: "#alerts"
    #     title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]
