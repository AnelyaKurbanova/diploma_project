global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fastapi
    static_configs:
      - targets:
          # Prod: FastAPI в Docker-compose (service `api`)
          - "api:8000"
          # Dev: FastAPI запущен локально на хосте (venv, uvicorn)
          # Для Docker на macOS / Windows host доступен как host.docker.internal
          - "host.docker.internal:8000"
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
